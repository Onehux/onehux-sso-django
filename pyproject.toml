[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onehux-sso"
version = "0.1.3"
description = "Django SDK for OneHux Accounts SSO (Authorization Code + PKCE, real hosted login page, RP-initiated logout)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2",
    "requests>=2.31",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-django>=4.8"]

[project.urls]
Homepage = "https://accounts.onehux.com"
Documentation = "https://accounts.onehux.com/dashboard/docs/integrate/backend/django"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
