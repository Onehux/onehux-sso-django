# .github/workflows/publish.yml
# Publishes to PyPI via Trusted Publishing (OIDC) — no stored API token. Fires only when a
# GitHub Release is published, never on an ordinary push, so creating the Release itself is the
# real confirmation step for this irreversible action.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
